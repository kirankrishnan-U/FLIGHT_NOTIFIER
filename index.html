<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Flight Notify V3</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <h1>✈ Flight Notify</h1>

    <div class="card">

        <div class="tabs">
            <button id="arrivalBtn">Arrivals</button>
            <button id="departureBtn">Departures</button>
        </div>

        <label>Date</label>
        <input type="date" id="date">

        <label>Flight Number</label>

        <div class="search">
            <input id="flightInput" placeholder="EK532">
            <button onclick="searchFlight()">Search</button>
        </div>

        <label>Refresh Interval</label>

        <select id="refreshInterval">
            <option value="5">Every 5 minutes</option>
            <option value="10" selected>Every 10 minutes</option>
            <option value="15">Every 15 minutes</option>
            <option value="30">Every 30 minutes</option>
            <option value="60">Every 1 hour</option>
        </select>

        <label>Monitoring Duration</label>

        <select id="monitorDuration">
            <option value="30">30 minutes</option>
            <option value="60" selected>1 hour</option>
            <option value="180">3 hours</option>
            <option value="360">6 hours</option>
            <option value="until_landed">Until flight lands</option>
        </select>

        <div class="monitor-buttons">

            <button id="startMonitorBtn" onclick="startMonitoring()">
                🔔 Start Monitoring
            </button>

            <button id="stopMonitorBtn" onclick="stopMonitoring()" disabled>
                ⛔ Stop
            </button>

        </div>

        <p id="monitorStatus">
            Monitoring: OFF
        </p>

    </div>


    <div class="card">

        <h2 id="flightTitle">No Flight Selected</h2>

        <p>Status: <span id="status">-</span></p>

        <p>Origin: <span id="origin">-</span></p>

        <p>Scheduled: <span id="scheduled">-</span></p>

        <p>Estimated: <span id="estimated">-</span></p>

        <p>Terminal: <span id="terminal">-</span></p>

        <p>Gate: <span id="gate">-</span></p>

        <p>Updated: <span id="updated">-</span></p>

        <button onclick="toggleFav()">⭐ Favourite</button>

        <button onclick="toggleNotify()">🔔 Notify</button>

    </div>


    <div class="nav">

        <button>🏠</button>
        <button>⭐</button>
        <button>🕒</button>
        <button>⚙️</button>

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="app.js"></script>

</body>
</html>
